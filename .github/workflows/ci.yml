name: CI
on:
  # Solo-репо без внешних форков: head-коммит любого PR уже пушится в ветку,
  # поэтому push уже покрывает PR по тому же SHA. Триггер pull_request убран,
  # чтобы избежать двойного прогона CI (push↔PR) на same-repo PR.
  push: { branches: ['**'] }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        # Тот же образ, что в локальном Supabase-стеке: роли anon/authenticated/
        # service_role, auth.uid() и pgTAP уже внутри (решение 8 плана slice1a).
        image: supabase/postgres:17.6.1.140
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['54329:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL_ADMIN: postgres://postgres:postgres@localhost:54329/postgres
      DATABASE_URL: postgres://orbis_app:orbis_app_ci@localhost:54329/postgres
      ORBIS_APP_PASSWORD: orbis_app_ci
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        # Пин к локально верифицированной версии: bun 1.3.x бракует integrity
        # lock-файла, созданного 1.2.x (первый прогон CI, 2026-07-03).
        with: { bun-version: 1.2.7 }
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run db:prepare   # миграции + роль orbis_app + сид реестра + pgTAP
      - run: bun run test
      # Греп-гейт старой формы (§А12-2, приёмка §С8-10) — ПАДАЮЩИЙ с «Пересева мира»: срез
      # перевёл форму данных целиком, и с этого момента совпадение вне allowlist означает
      # вернувшуюся старую форму, а не незаконченный перевод.
      #
      # ОТДЕЛЬНЫМ шагом, хотя `bun run test` уже гоняет `scripts/check-legacy-form.test.ts`:
      # тест проверяет МЕХАНИКУ гейта на синтетических репозиториях, а этот шаг — РАБОЧЕЕ
      # ДЕРЕВО. Первый зеленел бы и на дереве, полном старой формы.
      - run: bun scripts/check-legacy-form.ts --gate
      # Перф-гейт (D21) — ОТДЕЛЬНЫМ шагом, а не внутри `bun run test`, и это не стилистика.
      # `bun run test` гонит сьюты трёх пакетов ПАРАЛЛЕЛЬНО; под этой нагрузкой гейт мерил
      # загрузку машины, а не код (`fastpath:create` 158 мс при бюджете 150 против 29.6 мс
      # изолированно — соврал трижды за срез Ш1). Цепочка «параллельные сьюты && гейт» тоже
      # не годится: засев фикстуры на 2000 сущностей иногда приезжал неполным сразу после
      # параллельного прогона. Отдельный шаг — гейт остаётся обязательным и меряет код.
      - run: bun run test:perf
      # Сборка web не покрыта тестами: регрессия vite-плагина, импорта ассета или
      # tsconfig проходила CI зелёной и всплывала только падением деплоя на Render.
      - run: bun run --filter @orbis/web build
      # Ленивая загрузка экранов (D33) не видна ни тестам, ни сборке: один статический
      # импорт экрана возвращает его чанк во входной, и всё остаётся зелёным. Разбор и
      # замер — в докблоке скрипта.
      - run: bun scripts/check-lazy-chunks.ts
