# Render Blueprint — прод Orbis (слайс 1c-2, Фаза B).
# Деплой: dashboard.render.com → New → Blueprint → выбрать этот репозиторий, ветку main.
# Один web-сервис (Docker, Bun 1.2.7) раздаёт и API (Hono: /trpc, /mcp, /health), и статику
# web-клиента (apps/web/dist) с одного origin — CORS не нужен, клиент бьёт в относительный /trpc.
# Секреты (sync: false) задаются в Render UI, в git не хранятся.
services:
  - type: web
    name: orbis
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      # --- Рантайм API ---
      # Продуктовое подключение: роль orbis_app (RLS enforced) через session-пулер :5432.
      # Формат: postgresql://orbis_app.<PROD_REF>:<пароль>@<POOLER_HOST>:5432/postgres
      # <POOLER_HOST> — Supabase Dashboard → Connect (per-project; прод ceovqtdibalxnqkgedrl → aws-0-eu-central-1.pooler.supabase.com)
      - key: DATABASE_URL
        sync: false
      # session-пулер поддерживает prepared statements → prepare=true (для :6543 было бы false).
      - key: PG_PREPARE
        value: "true"
      # Планировщик рутин (V1.2): тик раз в минуту внутри процесса, включается явно — на
      # стенде и в тестах фон молчит. Значение НЕ задаётся здесь намеренно (sync: false,
      # как у секретов): auto-deploy из main и Blueprint-sync применили бы «1» при ближайшем
      # деплое — ДО миграции 0013, пересева реестра и остальных задач среза, а порядок ввода
      # на проде обратный (Р-14): миграция 0013 → пересев → код → переменная руками в Render
      # UI (runbook, Задача 16). Включённый фон без политики и гранта 0013 падает на каждом
      # тике с 42501 (нет прав на user_settings у orbis_app) — не «видит пустой список», а
      # не доходит до него; без реестра упадёт на первой же записи прогона. Включено на проде
      # 2026-08-19 (миграция 0013 → пересев → код → переменная в Render UI); значение здесь —
      # тот самый docs-коммит после включения: блюпринт и сервис совпадают. Выключать —
      # ОДНОВРЕМЕННО в UI и здесь, иначе Blueprint-sync вернёт «1» ближайшим деплоем.
      - key: ORBIS_ROUTINE_SCHEDULER
        value: "1"
      # Supabase API для верификации JWT (jose): JWKS = {SUPABASE_URL}/auth/v1/.well-known/jwks.json.
      - key: SUPABASE_URL
        sync: false # https://<PROD_REF>.supabase.co
      - key: SUPABASE_JWT_SECRET
        sync: false # Supabase → Settings → API → JWT Settings (fallback HS256)
      # LLM (§7.7): провайдера два. Ключи провайдеров — нужен ТОТ, который выбран ниже;
      # оба сразу без явного ORBIS_LLM_PROVIDER сервис не поднимут — это осознанный отказ,
      # а не баг. ВАЖНО: ключ выбранного провайдера обязан быть задан ДО деплоя, и им же
      # прогоняется гейт llm-smoke перед доверием AI в проде. Без ключа старт падает
      # намеренно — иначе сервис поднялся бы с echo-заглушкой и молча отвечал ею
      # и в UI, и MCP-агенту.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # Явный выбор провайдера: снимает «неявный echo при пустом ключе» (см. llm/provider.ts).
      - key: ORBIS_LLM_PROVIDER
        value: openai
      # Публичный адрес сервиса — база всех абсолютных URL в метаданных OAuth (§9.3,
      # RFC 9728/8414). Не секрет, поэтому значение прямо здесь. В production ОБЯЗАТЕЛЬНА:
      # без неё контейнер намеренно не стартует (oauth/metadata.ts), потому что иначе базу
      # пришлось бы брать из заголовка Host — подменённый Host увёл бы MCP-клиента на чужой
      # authorization server через наши же метаданные. Только чистый origin: путь, query
      # или фрагмент в значении — тоже отказ при старте.
      - key: ORBIS_PUBLIC_URL
        value: https://orbis-64q4.onrender.com
      # ORBIS_PAT_HASH и ORBIS_PAT_OWNER_ID сняты решением D34: доступ внешнего агента
      # (и браузерный, и headless-PAT) живёт строкой в таблице agent_grants, а не в
      # окружении. Отзыв — «Настройки → Агенты», а не смена переменной с передеплоем;
      # выпуск headless-токена — bun scripts/ops.ts issue-pat (runbook §3.2).
      # Если переменные ещё лежат на сервисе в Render UI — удалить: их не читает ни одна
      # строка кода, и мёртвая переменная выглядит живой конфигурацией.
      # --- Build-time web-клиент (Vite бакает в бандл; Render отдаёт их как --build-arg) ---
      - key: VITE_SUPABASE_URL
        sync: false # https://<PROD_REF>.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        sync: false # Supabase → Settings → API → anon public
      # VITE_API_URL не задаём: пусто → относительный /trpc (режим same-origin, Вариант A).
